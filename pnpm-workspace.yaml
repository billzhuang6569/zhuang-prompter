# Use a flat, npm-style node_modules so electron-builder's dependency
# collector packages ALL transitive deps (e.g. debug's child `ms`).
# pnpm 11 reads nodeLinker from here (NOT from .npmrc). See docs/RELEASE.md.
nodeLinker: hoisted
allowBuilds:
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
