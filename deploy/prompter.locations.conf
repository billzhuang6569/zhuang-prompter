# Independent product files; never points at the Skillhub manifest.
location = /prompter/releases/latest.json {
    alias /mnt/pictshare/zhuang-prompter/channels/stable/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /prompter/download/macos-arm64 {
    alias /mnt/pictshare/zhuang-prompter/channels/stable/macos-arm64.dmg;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="zhuang-prompter-macos-arm64.dmg"';
    add_header Cache-Control "no-store" always;
}
location = /prompter/download/windows-x64 {
    alias /mnt/pictshare/zhuang-prompter/channels/stable/windows-x64.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="zhuang-prompter-windows-x64.exe"';
    add_header Cache-Control "no-store" always;
}
location = /prompter/download/windows-arm64 {
    alias /mnt/pictshare/zhuang-prompter/channels/stable/windows-arm64.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="zhuang-prompter-windows-arm64.exe"';
    add_header Cache-Control "no-store" always;
}
location ^~ /prompter/updates/stable/ {
    alias /mnt/pictshare/zhuang-prompter/channels/stable/updater/;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /prompter/downloads/ {
    alias /mnt/pictshare/zhuang-prompter/releases/;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options nosniff always;
}
